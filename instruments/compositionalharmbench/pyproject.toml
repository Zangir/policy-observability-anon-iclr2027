[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "compositional-harm-bench"
version = "1.0.0"
description = "Counterfactually paired local-pass trajectories for agent safety"
requires-python = ">=3.11"
license = "MIT"

[tool.setuptools]
packages = ["compositional_harm_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
